name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and run tests
        run: mvn -B clean test
        # If your repo root is JAVA-POE (with POE_Part2 as a subfolder),
        # move this file to JAVA-POE/.github/workflows/ and uncomment:
        # working-directory: POE_Part2
